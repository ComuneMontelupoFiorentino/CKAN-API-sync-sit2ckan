; ============================================================
; config/common.ini
; Parametri comuni a tutti gli ambienti (non sensibili).
; Committare in VCS. NON inserire credenziali qui.
; ============================================================

[retry]
max_attempts   = 3
base_delay_ms  = 500
multiplier     = 2.0
max_delay_ms   = 10000

[filesystem]
; BASE_DIR viene sostituito a runtime con il percorso assoluto del progetto.
; I file sono organizzati per schema di origine: output/<database_origin>/
output_dir = BASE_DIR/output
lock_file  = BASE_DIR/run/scheduler.lock

[tables]
resource_log = opendata.resource_upload_log
error_log    = opendata.scheduler_error_log

[scheduling]
materialized_view = opendata.all_schedulation
query             = SELECT * FROM opendata.all_schedulation
